<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="ui-monospace,SF Mono,Menlo,monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="540" fill="#f7f3ec"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f1f1f">Microduck · 三层架构</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">硬件 → 系统软件 → RL 训练栈（端到端开源）</text>

  <!-- Layer 1: Hardware -->
  <rect x="40" y="90" width="820" height="100" fill="#fff" stroke="#1f1f1f" stroke-width="3"/>
  <rect x="40" y="90" width="120" height="100" fill="#ff5b3b" stroke="#1f1f1f" stroke-width="3"/>
  <text x="100" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">硬件层</text>
  <text x="100" y="155" text-anchor="middle" font-size="11" fill="#fff">闭源</text>

  <text x="180" y="120" font-size="14" font-weight="700" fill="#1f1f1f">物理实体</text>
  <text x="180" y="145" font-size="12" fill="#1f1f1f">· 14 × Dynamixel XL330 + 喙伺服（15 DOF）</text>
  <text x="180" y="165" font-size="12" fill="#1f1f1f">· Rockchip RK3566 / 1 GB RAM / 32 GB</text>
  <text x="180" y="182" font-size="12" fill="#1f1f1f">· 8×8 ToF + 双 IMU + 前置摄像头 + NP-F550</text>

  <!-- Layer 2: System software -->
  <rect x="40" y="220" width="820" height="100" fill="#fff" stroke="#1f1f1f" stroke-width="3"/>
  <rect x="40" y="220" width="120" height="100" fill="#ffd400" stroke="#1f1f1f" stroke-width="3"/>
  <text x="100" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1f">系统层</text>
  <text x="100" y="285" text-anchor="middle" font-size="11" fill="#1f1f1f">Apache 2.0</text>

  <text x="180" y="250" font-size="14" font-weight="700" fill="#1f1f1f">Rust daemon · JSON-RPC over Unix socket</text>
  <text x="180" y="275" font-size="12" fill="#1f1f1f">· robotd 控制核心（50 Hz）/ configd / updaterd / btd</text>
  <text x="180" y="295" font-size="12" fill="#1f1f1f">· padd 手柄 / mediad WebRTC / tofd 深度</text>
  <text x="180" y="312" font-size="12" fill="#1f1f1f">· minisign 签名 + 健康门 + 自动回滚</text>

  <!-- Layer 3: RL training -->
  <rect x="40" y="350" width="820" height="100" fill="#fff" stroke="#1f1f1f" stroke-width="3"/>
  <rect x="40" y="350" width="120" height="100" fill="#3b6bff" stroke="#1f1f1f" stroke-width="3"/>
  <text x="100" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RL 层</text>
  <text x="100" y="415" text-anchor="middle" font-size="11" fill="#fff">Apache 2.0</text>

  <text x="180" y="380" font-size="14" font-weight="700" fill="#1f1f1f">mab + MuJoCo Warp + PPO + BAM</text>
  <text x="180" y="405" font-size="12" fill="#1f1f1f">· 13 个主任务 + Backlash 变体 = 26 个</text>
  <text x="180" y="425" font-size="12" fill="#1f1f1f">· 61 维共享观测空间 / 14 维动作</text>
  <text x="180" y="442" font-size="12" fill="#1f1f1f">· ONNX 部署（归一化器烤进图）</text>

  <!-- Arrows between layers -->
  <line x1="450" y1="190" x2="450" y2="218" stroke="#1f1f1f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="320" x2="450" y2="348" stroke="#1f1f1f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="450" y="485" text-anchor="middle" font-size="12" fill="#666">↑ 闭源硬件仅提供接口 / 系统 + RL 层全部 Apache 2.0</text>
  <text x="450" y="505" text-anchor="middle" font-size="11" fill="#999">Source: pollen-robotics/microduck + microduck_rl · 2026-09-01</text>
</svg>