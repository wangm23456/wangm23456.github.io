<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="ui-monospace,SF Mono,Menlo,monospace">
  <defs>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3eee5"/>
      <stop offset="100%" stop-color="#dcd3c2"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="360" fill="#f7f3ec"/>
  <ellipse cx="450" cy="290" rx="380" ry="20" fill="url(#floor)"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1f1f">Microduck · 4 个色号</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#666">Cream · Graph · Lavender · Sky</text>

  <!-- Cream -->
  <g transform="translate(140,180)" filter="url(#shadow)">
    <ellipse cx="0" cy="60" rx="38" ry="22" fill="#f7e6cb" stroke="#1f1f1f" stroke-width="2"/>
    <ellipse cx="0" cy="40" rx="34" ry="36" fill="#f7e6cb" stroke="#1f1f1f" stroke-width="2"/>
    <ellipse cx="20" cy="38" rx="18" ry="14" fill="#fff" stroke="#1f1f1f" stroke-width="2"/>
    <circle cx="22" cy="38" r="3" fill="#1f1f1f"/>
    <path d="M40,40 L60,35 L40,30 z" fill="#ff8b3b" stroke="#1f1f1f" stroke-width="2"/>
    <rect x="-4" y="78" width="6" height="14" fill="#ff8b3b"/>
    <rect x="6" y="78" width="6" height="14" fill="#ff8b3b"/>
  </g>
  <text x="140" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1f">Cream</text>
  <text x="140" y="298" text-anchor="middle" font-size="11" fill="#666">#f7e6cb</text>

  <!-- Graphite -->
  <g transform="translate(320,180)" filter="url(#shadow)">
    <ellipse cx="0" cy="60" rx="38" ry="22" fill="#6c6a68" stroke="#1f1f1f" stroke-width="2"/>
    <ellipse cx="0" cy="40" rx="34" ry="36" fill="#6c6a68" stroke="#1f1f1f" stroke-width="2"/>
    <ellipse cx="20" cy="38" rx="18" ry="14" fill="#fff" stroke="#1f1f1f" stroke-width="2"/>
    <circle cx="22" cy="38" r="3" fill="#1f1f1f"/>
    <path d="M40,40 L60,35 L40,30 z" fill="#ffd400" stroke="#1f1f1f" stroke-width="2"/>
    <rect x="-4" y="78" width="6" height="14" fill="#ffd400"/>
    <rect x="6" y="78" width="6" height="14" fill="#ffd400"/>
  </g>
  <text x="320" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1f">Graphite</text>
  <text x="320" y="298" text-anchor="middle" font-size="11" fill="#666">#6c6a68</text>

  <!-- Lavender -->
  <g transform="translate(500,180)" filter="url(#shadow)">
    <ellipse cx="0" cy="60" rx="38" ry="22" fill="#bfa9cf" stroke="#1f1f1f" stroke-width="2"/>
    <ellipse cx="0" cy="40" rx="34" ry="36" fill="#bfa9cf" stroke="#1f1f1f" stroke-width="2"/>
    <ellipse cx="20" cy="38" rx="18" ry="14" fill="#fff" stroke="#1f1f1f" stroke-width="2"/>
    <circle cx="22" cy="38" r="3" fill="#1f1f1f"/>
    <path d="M40,40 L60,35 L40,30 z" fill="#ffd400" stroke="#1f1f1f" stroke-width="2"/>
    <rect x="-4" y="78" width="6" height="14" fill="#ffd400"/>
    <rect x="6" y="78" width="6" height="14" fill="#ffd400"/>
  </g>
  <text x="500" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1f">Lavender</text>
  <text x="500" y="298" text-anchor="middle" font-size="11" fill="#666">#bfa9cf</text>

  <!-- Sky -->
  <g transform="translate(680,180)" filter="url(#shadow)">
    <ellipse cx="0" cy="60" rx="38" ry="22" fill="#a9dbe8" stroke="#1f1f1f" stroke-width="2"/>
    <ellipse cx="0" cy="40" rx="34" ry="36" fill="#a9dbe8" stroke="#1f1f1f" stroke-width="2"/>
    <ellipse cx="20" cy="38" rx="18" ry="14" fill="#fff" stroke="#1f1f1f" stroke-width="2"/>
    <circle cx="22" cy="38" r="3" fill="#1f1f1f"/>
    <path d="M40,40 L60,35 L40,30 z" fill="#ff8b3b" stroke="#1f1f1f" stroke-width="2"/>
    <rect x="-4" y="78" width="6" height="14" fill="#ff8b3b"/>
    <rect x="6" y="78" width="6" height="14" fill="#ff8b3b"/>
  </g>
  <text x="680" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1f1f">Sky</text>
  <text x="680" y="298" text-anchor="middle" font-size="11" fill="#666">#a9dbe8</text>

  <text x="450" y="340" text-anchor="middle" font-size="10" fill="#999">Source: pollen-robotics.com press kit · 2026-08-27</text>
</svg>