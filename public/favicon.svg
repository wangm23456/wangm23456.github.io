<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --star-fill: #ffd23f;
      --star-stroke: #111111;
      --core-fill: #111111;
      --center-dot: #fffaf1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --star-fill: #ffd23f;
        --star-stroke: #f2f2f2;
        --core-fill: #181818;
        --center-dot: #f2f2f2;
      }
    }
  </style>
  <!-- 外围超锐利自旋放射星芒 -->
  <polygon points="50,4 62,30 96,16 72,48 96,80 64,68 50,96 36,68 4,80 28,48 4,16 38,30" 
           fill="var(--star-fill)" stroke="var(--star-stroke)" stroke-width="4.5" stroke-linejoin="miter"/>

  <!-- 内部紧凑自旋黑洞核 -->
  <polygon points="50,24 58,40 76,34 64,50 76,64 58,60 50,76 42,60 24,64 36,50 24,34 42,40" 
           fill="var(--core-fill)" stroke="var(--star-stroke)" stroke-width="3" stroke-linejoin="miter"/>

  <!-- 4 极硬核穿透主轴 -->
  <line x1="50" y1="4" x2="50" y2="24" stroke="var(--star-stroke)" stroke-width="4.5"/>
  <line x1="96" y1="16" x2="76" y2="34" stroke="var(--star-stroke)" stroke-width="4.5"/>
  <line x1="96" y1="80" x2="76" y2="64" stroke="var(--star-stroke)" stroke-width="4.5"/>
  <line x1="50" y1="96" x2="50" y2="76" stroke="var(--star-stroke)" stroke-width="4.5"/>
  <line x1="4" y1="80" x2="24" y2="64" stroke="var(--star-stroke)" stroke-width="4.5"/>
  <line x1="4" y1="16" x2="24" y2="34" stroke="var(--star-stroke)" stroke-width="4.5"/>

  <!-- 核心理性奇点 -->
  <circle cx="50" cy="50" r="5" fill="var(--center-dot)" stroke="var(--star-stroke)" stroke-width="2.5"/>
</svg>
